<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>Relay Collective</title>
  <defs>
    <linearGradient id="rc-tile" x1="6" y1="4" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2251E8"/>
      <stop offset="1" stop-color="#101B52"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#rc-tile)"/>
  <g transform="rotate(-40 32 32)">
    <!-- The relay: one link passed through the centre, from one side of the circle to the other -->
    <path d="M14 32H50" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    <!-- The collective: two arcs that together close the circle -->
    <path d="M14 32A18 18 0 0 1 46.6 21.4" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M50 32A18 18 0 0 1 17.4 42.6" stroke="#5FD8E8" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="14" cy="32" r="5" fill="#FFFFFF"/>
    <circle cx="50" cy="32" r="5" fill="#5FD8E8"/>
    <circle cx="32" cy="32" r="5" fill="#FFFFFF"/>
  </g>
</svg>
